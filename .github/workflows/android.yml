name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files (kept out of the repo)
        run: |
          flutter create --platforms=android --org com.campusstay --project-name campusstay .
          rm -f test/widget_test.dart
      - name: Allow internet in release builds and set the app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' $M
          sed -i 's#android:label="campusstay"#android:label="CampusStay"#' $M
          grep -q "android.permission.INTERNET" $M || (echo "INTERNET permission was not added" && exit 1)
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: campusstay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
