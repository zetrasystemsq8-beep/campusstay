name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files (kept out of the repo)
        run: |
          flutter create --platforms=android --org com.campusstay --project-name campusstay .
          rm -f test/widget_test.dart
      - name: Allow internet, location and microphone, and set the app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' $M
          sed -i 's#android:label="campusstay"#android:label="CampusStay"#' $M
          sed -i 's#<uses-permission android:name="android.permission.INTERNET"/>#&\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>#' $M
          sed -i 's#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>#' $M
          if grep -q "<queries>" $M; then
            sed -i 's#<queries>#&\n        <intent><action android:name="android.speech.RecognitionService"/></intent>#' $M
          else
            sed -i 's#<application#<queries>\n        <intent><action android:name="android.speech.RecognitionService"/></intent>\n    </queries>\n    <application#' $M
          fi
          grep -q "RECORD_AUDIO" $M || (echo "Microphone permission was not added" && exit 1)
          grep -q "RecognitionService" $M || (echo "Speech queries were not added" && exit 1)
          grep -q "ACCESS_FINE_LOCATION" $M || (echo "Location permission was not added" && exit 1)
          grep -q "android.permission.INTERNET" $M || (echo "INTERNET permission was not added" && exit 1)
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Release key found: the build will be signed with it."
          else
            echo "::warning::No signing key set. This build is signed with the DEBUG key and cannot go to the Play Store. Run tool/make_keystore.sh once."
          fi
          python3 tool/patch_android_signing.py android/app
      - run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build APK and app bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
          SUPPORT_WHATSAPP: ${{ secrets.SUPPORT_WHATSAPP }}
          TERMS_URL: ${{ secrets.TERMS_URL }}
          PRIVACY_URL: ${{ secrets.PRIVACY_URL }}
          MAP_TILE_URL: ${{ secrets.MAP_TILE_URL }}
          APP_LINK: ${{ secrets.APP_LINK }}
          MAP_ATTRIBUTION: ${{ secrets.MAP_ATTRIBUTION }}
        run: |
          # The run number goes up with every build, which the Play Store needs for each upload.
          ARGS=(--dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" --build-number="$GITHUB_RUN_NUMBER")
          # Optional settings are passed only when set, so the app's built-in defaults apply otherwise.
          for NAME in APP_LINK SUPPORT_EMAIL SUPPORT_WHATSAPP TERMS_URL PRIVACY_URL MAP_TILE_URL MAP_ATTRIBUTION; do
            VALUE="${!NAME}"
            if [ -n "$VALUE" ]; then ARGS+=(--dart-define="$NAME=$VALUE"); fi
          done
          flutter build apk --release "${ARGS[@]}"
          flutter build appbundle --release "${ARGS[@]}"
      - name: Check how the APK was signed
        env:
          HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          APKSIGNER="$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)"
          OUT="$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          echo "$OUT"
          FP="$(echo "$OUT" | grep -m1 'SHA-256' || true)"
          {
            echo "### Signing"
            if [ "$HAS_KEY" = "true" ]; then echo "Signed with your release key."; else echo "**Signed with the debug key.** Not accepted by the Play Store."; fi
            echo
            echo "$FP"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_KEY" = "true" ] && echo "$OUT" | grep -qi "Android Debug"; then
            echo "A release key is set, but the APK is signed with the debug key."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: campusstay-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
